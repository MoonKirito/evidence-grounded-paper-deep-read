# Evidence-Grounded Paper Deep Read CLI config example

[llm]
provider = "mimo"
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
model = "mimo-v2.5-pro"
api_key_env = "MIMO_API_KEY"
temperature = 0.2
max_tokens = 24000
timeout_seconds = 900
stream = true

[pipeline]
language = "中文"
generation_mode = "sectioned"
max_input_chars = 120000
validate_report = true
skip_existing = false

[pdffigures2]
jar_path = ""
java_path = "java"

