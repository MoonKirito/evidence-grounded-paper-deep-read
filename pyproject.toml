[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-grounded-paper-deep-read"
version = "0.1.0"
description = "A Codex skill and CLI workflow for evidence-grounded deep-reading reports from research PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MoonKirito" }
]
keywords = ["paper-reading", "pdf", "codex-skill", "research", "markdown-report"]
dependencies = [
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "pypdf>=6.0",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  "tqdm>=4.66",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
paperdeepread = "paperdeepread.cli:main"

[tool.setuptools.packages.find]
include = ["paperdeepread*"]
