[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-grounded-paper-deep-read"
version = "0.1.0"
description = "A Codex skill and CLI workflow for evidence-grounded deep-reading reports from research PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "MoonKirito" }
]
keywords = ["paper-reading", "pdf", "codex-skill", "research", "markdown-report"]
dependencies = [
  "pymupdf>=1.24",
  "tqdm>=4.66",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
fallback = ["pdfplumber>=0.11"]

[project.scripts]
paperdeepread = "paperdeepread.cli:main"

[tool.setuptools.packages.find]
include = ["paperdeepread*"]

[tool.setuptools.data-files]
"share/paperdeepread/skill" = ["skills/evidence-grounded-paper-deep-read/SKILL.md"]
"share/paperdeepread/skill/agents" = ["skills/evidence-grounded-paper-deep-read/agents/*.yaml"]
"share/paperdeepread/skill/assets" = ["skills/evidence-grounded-paper-deep-read/assets/*.md"]
"share/paperdeepread/skill/references" = ["skills/evidence-grounded-paper-deep-read/references/*.md"]
"share/paperdeepread/skill/scripts" = ["skills/evidence-grounded-paper-deep-read/scripts/*.py"]
